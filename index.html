<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0;url=./os/">
<title>Opening My OS…</title>
<script>
(function(){
  var destination=new URL('./os/',window.location.href);
  var params=new URLSearchParams(window.location.search);
  params.forEach(function(value,key){destination.searchParams.set(key,value)});
  window.location.replace(destination.href);
})();
</script>
</head>
<body><p>Opening My OS… <a href="./os/">Continue</a></p></body>
