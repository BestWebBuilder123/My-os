<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101426"><title>My OS — Liquid</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="src/styles.css"><script defer src="src/app.js?v=effect-controls-no-legacy-stack-v5"></script></head><body><main id="desktop" class="desktop"><div id="wallpaper-image" class="wallpaper-image" aria-hidden="true"></div><div class="wallpaper-shade"></div><section id="desktop-icons" class="desktop-icons" aria-label="Desktop"></section><section id="windows" class="windows"></section><div id="selection-box" class="selection-box"></div><div id="dock" class="dock glass"><button class="dock-launch" data-action="launcher" title="Applications">◈</button><span class="dock-divider"></span><div id="dock-apps" class="dock-apps"></div><span class="dock-spacer"></span><button data-action="control" title="Control center">☷</button><button data-action="notifications" title="Notifications">♧</button><button data-action="calendar" title="Calendar">▦</button><button id="clock" class="dock-clock" data-action="calendar">12:00</button></div><div id="launcher" class="launcher glass hidden"><div class="launcher-head"><input id="app-search" placeholder="Search apps and files…" autocomplete="off"><button data-action="close-launcher">✕</button></div><div class="launcher-label">FAVORITES</div><div id="launcher-apps" class="app-grid"></div><div class="launcher-foot"><span>My OS</span><button data-app="settings">⚙ Settings</button></div></div><div id="control-center" class="control-center glass hidden"><div class="panel-title">Control Center</div><div class="quick-grid"><button data-setting="theme" data-value="dark">◐<span>Appearance</span></button><button data-action="wifi">⌁<span>Network</span></button><button data-action="focus">☾<span>Focus</span></button><button data-action="bluetooth">ᛒ<span>Bluetooth</span></button></div><div class="control-row"><label>Brightness</label><input type="range" min="40" max="100" value="100" id="brightness"></div><div class="control-row"><label>Volume</label><input type="range" min="0" max="100" value="65" id="volume"></div><div class="control-bottom"><span id="control-date"></span><button data-app="settings">All settings ↗</button></div></div><div id="notifications" class="notifications glass hidden"><div class="panel-title">Notification Center <button data-action="clear-notifications">Clear</button></div><div id="notification-list"><div class="empty-state">You're all caught up.</div></div></div><div id="context-menu" class="context-menu glass hidden"></div><div id="toast" class="toast glass hidden"></div></main><input type="file" id="file-import" multiple hidden><input type="file" id="wallpaper-import" accept="image/*" hidden><input type="file" id="audio-import" accept="audio/*" multiple hidden><input type="file" id="image-import" accept="image/*" multiple hidden></body></html>
