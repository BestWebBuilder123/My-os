<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IxxlEffects</title>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif;background:#0d1018;color:#f5f6ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 0%,#26365c 0,transparent 48%),radial-gradient(ellipse at 100% 100%,#29244d 0,transparent 44%),#0d1018}
main{width:min(620px,100%);padding:34px;border:1px solid #ffffff20;border-radius:24px;background:#151a29dd;box-shadow:0 24px 90px #0008;backdrop-filter:blur(24px)}
.logo{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#8d9cff,#a78bfa);font-size:27px;font-weight:800;color:#111526}
h1{font-size:27px;margin:20px 0 8px}p{color:#aeb7d0;line-height:1.6;margin:8px 0 18px}
.drop{display:grid;place-items:center;text-align:center;gap:10px;padding:28px 18px;border:1px dashed #8292cb80;border-radius:18px;background:#ffffff06;transition:.18s}
.drop.drag{border-color:#a8b6ff;background:#8d9cff18}.drop strong{color:#f5f6ff}
button{border:0;border-radius:12px;padding:12px 18px;background:#91a1ff;color:#101526;font-weight:700;cursor:pointer}
input{display:none}.hint{font-size:12px;margin:14px 0 0;color:#8792ad}
</style>
</head>
<body>
<main>
<div class="logo">✦</div>
<h1>IxxlEffects</h1>
<p>Your motion-graphics editor is ready to load. Choose the single HTML file from the EffectCraft Studio X ZIP you downloaded.</p>
<div class="drop" id="drop">
<strong>Drop the editor HTML file here</strong>
<span style="color:#9da8c4;font-size:13px">or</span>
<button id="choose" type="button">Choose EffectCraft_Studio_X_Graphs.html</button>
<input id="file" type="file" accept=".html,text/html">
</div>
<p class="hint">The editor runs locally inside this My-os window. Your selected file is not uploaded to a server.</p>
</main>
<script>
const input=document.getElementById('file'),drop=document.getElementById('drop');
document.getElementById('choose').onclick=()=>input.click();
function load(file){if(!file)return;if(!/\.html?$/i.test(file.name)){alert('Please choose the .html editor file, not the ZIP or a preview image.');return}const reader=new FileReader();reader.onload=()=>{const source=String(reader.result||'');if(!/<html[\s>]/i.test(source)||!/<script[\s>]/i.test(source)){alert('That file does not look like the EffectCraft HTML editor.');return}document.open();document.write(source);document.close()};reader.onerror=()=>alert('Could not read that file.');reader.readAsText(file)}
input.onchange=()=>load(input.files&&input.files[0]);
for(const name of ['dragenter','dragover'])drop.addEventListener(name,e=>{e.preventDefault();drop.classList.add('drag')});
for(const name of ['dragleave','drop'])drop.addEventListener(name,e=>{e.preventDefault();drop.classList.remove('drag')});
drop.addEventListener('drop',e=>load(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]));
</script>
</body></html>
